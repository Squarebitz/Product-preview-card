<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <!-- ====== Product Card ====== -->
      <section id="container">

        <div class="banner"></div>

        <div class="product-info">

          <h1 class="product-category">Perfume</h1>
          
          <h2 class="product-name">Gabrielle Essence Eau De Parfum</h2>

          <p class="product-description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          
          <div class="price">
            <h3 class="current-price">$149.99</h3>
            <p class="old-price">$169.99</p>
          </div>

          <button class="btn-add-to-cart">
            <img src="./images/icon-cart.svg" alt="cart icon" class="cart-icon" />
            Add to Cart
          </button>
          
        </div>
      </section>
    </main>

  <!-- ====== Footer ====== -->
  <footer>
    <p>coded by <a href="https://github.com/Squarebitz" target="_blank">Unscarthed</a></p>
  </footer> 
  </body>
</html>
